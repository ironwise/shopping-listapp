<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑 리스트</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1b1d21;
    --muted: #6b7280;
    --line: #e4e7ec;
    --accent: #2f6fed;
    --accent-ink: #ffffff;
    --danger: #c0392b;
    --done: #9aa1ab;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --card: #1e2128;
      --text: #e8eaed;
      --muted: #9aa1ab;
      --line: #2e323b;
      --accent: #5b8dff;
      --accent-ink: #0e1116;
      --danger: #ff8178;
      --done: #6b7280;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem 4rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 34rem; margin: 0 auto; }

  header { margin-bottom: 1.25rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; letter-spacing: -.02em; }
  .count { color: var(--muted); font-size: .9rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  /* ---- 입력 ---- */
  form {
    display: flex;
    gap: .5rem;
    padding: .875rem;
    border-bottom: 1px solid var(--line);
  }
  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: .7rem .85rem;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 9px;
  }
  input[type="text"]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
    border-color: transparent;
  }
  button {
    font: inherit;
    cursor: pointer;
    border-radius: 9px;
    border: 1px solid transparent;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .add {
    padding: .7rem 1.1rem;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    white-space: nowrap;
  }
  .add:disabled { opacity: .45; cursor: not-allowed; }

  /* ---- 목록 ---- */
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .2rem .875rem;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: 0; }

  /* 라벨 전체를 클릭 영역으로 — 작은 체크박스만 노리지 않아도 된다 */
  li label {
    flex: 1;
    display: flex;
    align-items: center;
    gap: .75rem;
    padding: .7rem 0;
    cursor: pointer;
    min-width: 0;
  }
  li input[type="checkbox"] {
    flex: none;
    width: 1.15rem;
    height: 1.15rem;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .name { overflow-wrap: anywhere; }
  li.done .name { color: var(--done); text-decoration: line-through; }

  .del {
    flex: none;
    padding: .4rem .55rem;
    background: transparent;
    color: var(--muted);
    line-height: 1;
    font-size: 1.1rem;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }

  /* 빈 상태 */
  .empty { padding: 2.5rem 1rem; text-align: center; color: var(--muted); }
  .empty p { margin: 0; }

  /* ---- 하단 도구 ---- */
  .tools {
    display: flex;
    justify-content: flex-end;
    gap: .5rem;
    margin-top: .75rem;
  }
  .ghost {
    padding: .5rem .75rem;
    background: transparent;
    color: var(--muted);
    border-color: var(--line);
    font-size: .875rem;
  }
  .ghost:hover:not(:disabled) { color: var(--text); background: var(--card); }
  .ghost:disabled { opacity: .4; cursor: not-allowed; }

  /* 중복 입력 시 기존 항목을 잠깐 강조 */
  @keyframes flash {
    0%, 100% { background: transparent; }
    30%      { background: color-mix(in srgb, var(--accent) 18%, transparent); }
  }
  li.flash { animation: flash 1s ease; }

  /* 스크린리더 전용 */
  .sr {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>쇼핑 리스트</h1>
    <p class="count" id="count">항목이 없습니다</p>
  </header>

  <div class="card">
    <form id="form" autocomplete="off">
      <label class="sr" for="input">살 물건</label>
      <input id="input" type="text" placeholder="살 물건을 입력하세요" maxlength="100">
      <button type="submit" class="add" id="addBtn" disabled>추가</button>
    </form>

    <ul id="list"></ul>

    <div class="empty" id="empty">
      <p>아직 담은 물건이 없습니다.</p>
    </div>
  </div>

  <div class="tools">
    <button type="button" class="ghost" id="clearDone" disabled>완료 항목 지우기</button>
    <button type="button" class="ghost" id="clearAll" disabled>전체 지우기</button>
  </div>

  <!-- 변경 사항을 스크린리더에 알린다 -->
  <p class="sr" id="live" role="status" aria-live="polite"></p>
</div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'shopping-list.items.v1';
  const MAX_LEN = 100;

  const $form = document.getElementById('form');
  const $input = document.getElementById('input');
  const $addBtn = document.getElementById('addBtn');
  const $list = document.getElementById('list');
  const $empty = document.getElementById('empty');
  const $count = document.getElementById('count');
  const $clearDone = document.getElementById('clearDone');
  const $clearAll = document.getElementById('clearAll');
  const $live = document.getElementById('live');

  /** @type {{id: string, name: string, done: boolean}[]} */
  let items = load();

  /* ---------- 저장소 ----------
     사생활 보호 모드나 사이트 데이터 차단 설정에서는 접근 자체가 예외를 던진다.
     저장이 안 되더라도 앱은 그대로 동작해야 하므로 전부 감싼다. */

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      // 저장된 값도 외부 입력으로 본다. 모양이 맞는 것만 살린다.
      return parsed
        .filter((it) => it && typeof it.name === 'string')
        .map((it) => ({
          id: typeof it.id === 'string' ? it.id : newId(),
          name: it.name.slice(0, MAX_LEN),
          done: it.done === true,
        }));
    } catch {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
    } catch {
      /* 저장 실패는 무시한다 — 이번 세션에서는 계속 쓸 수 있다 */
    }
  }

  function newId() {
    return (crypto.randomUUID?.() ?? String(Date.now() + Math.random()));
  }

  /* ---------- 렌더 ---------- */

  function render(flashId = null) {
    $list.replaceChildren();

    for (const item of items) {
      const li = document.createElement('li');
      li.dataset.id = item.id;
      if (item.done) li.classList.add('done');
      if (item.id === flashId) li.classList.add('flash');

      const label = document.createElement('label');

      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = item.done;
      box.addEventListener('change', () => toggle(item.id));

      const name = document.createElement('span');
      name.className = 'name';
      // textContent 로만 넣는다 — 입력값이 마크업으로 해석되지 않는다
      name.textContent = item.name;

      label.append(box, name);

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '×';
      del.title = '삭제';
      del.setAttribute('aria-label', `${item.name} 삭제`);
      del.addEventListener('click', () => remove(item.id));

      li.append(label, del);
      $list.append(li);
    }

    const total = items.length;
    const left = items.filter((it) => !it.done).length;

    $empty.hidden = total > 0;
    $count.textContent = total === 0
      ? '항목이 없습니다'
      : `${left}개 남음 · 전체 ${total}개`;

    $clearAll.disabled = total === 0;
    $clearDone.disabled = total === left;
  }

  function announce(message) {
    $live.textContent = message;
  }

  /* ---------- 동작 ---------- */

  function add(rawName) {
    const name = rawName.trim().replace(/\s+/g, ' ').slice(0, MAX_LEN);
    if (!name) return;

    // 같은 물건을 두 번 담는 건 실수일 때가 많다. 추가하는 대신 기존 항목을 알려준다.
    const existing = items.find((it) => it.name.toLowerCase() === name.toLowerCase());
    if (existing) {
      // 이미 체크해 둔 물건을 다시 입력했다면 "또 필요하다"는 뜻이므로 체크를 푼다.
      existing.done = false;
      save();
      render(existing.id);
      announce(`${name}은(는) 이미 목록에 있습니다`);
      return;
    }

    const item = { id: newId(), name, done: false };
    items.push(item);
    save();
    render();
    announce(`${name} 추가됨`);
  }

  function toggle(id) {
    const item = items.find((it) => it.id === id);
    if (!item) return;
    item.done = !item.done;
    save();
    render();
    announce(`${item.name} ${item.done ? '완료' : '완료 취소'}`);
  }

  function remove(id) {
    const item = items.find((it) => it.id === id);
    if (!item) return;
    items = items.filter((it) => it.id !== id);
    save();
    render();
    announce(`${item.name} 삭제됨`);
  }

  /* ---------- 이벤트 ---------- */

  $form.addEventListener('submit', (e) => {
    e.preventDefault();
    add($input.value);
    $input.value = '';
    $addBtn.disabled = true;
    $input.focus();
  });

  $input.addEventListener('input', () => {
    $addBtn.disabled = $input.value.trim() === '';
  });

  $clearDone.addEventListener('click', () => {
    const removed = items.filter((it) => it.done).length;
    if (removed === 0) return;
    items = items.filter((it) => !it.done);
    save();
    render();
    announce(`완료 항목 ${removed}개 삭제됨`);
  });

  $clearAll.addEventListener('click', () => {
    if (items.length === 0) return;
    // 전체 삭제는 되돌리기 어렵다. 한 번 묻는다.
    if (!confirm('목록을 전부 지울까요?')) return;
    items = [];
    save();
    render();
    announce('전체 삭제됨');
  });

  render();
  $input.focus();
})();
</script>
</body>
</html>
